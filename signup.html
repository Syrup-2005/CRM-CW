        <div class="content">
            <div class="container">
            <h2 class="text-center mb-3">Sign Up</h2>

            <form action="signup_process.php" method="POST">
                <!-- Name -->
                <div class="form-group mb-3">
                    <label for="name">Full Name:</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>

                <!-- Email -->
                <div class="form-group mb-3">
                    <label for="email">Email:</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <!-- Phone Number -->
                <div class="form-group mb-3">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" class="form-control" id="phone" name="phone" required>
                </div>

                <!-- Password -->
                <div class="form-group mb-3">
                    <label for="password">Password:</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>

                <!-- Confirm Password -->
                <div class="form-group mb-3">
                    <label for="confirmPassword">Confirm Password:</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required oninput="validatePassword()">
                    <small id="passwordMismatch" class="form-text text-danger d-none">Passwords do not match.</small>
                </div>

                <div class="button-container">
                    <button type="submit" class="general-btns">Submit</button>
                </div>
                
            </form>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Password Validation JavaScript -->
    <script>
        function validatePassword() {
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;
            let message = document.getElementById("passwordMismatch");

            if (password !== confirmPassword) {
                message.classList.remove("d-none");
            } else {
                message.classList.add("d-none");
            }
        }
    </script>
