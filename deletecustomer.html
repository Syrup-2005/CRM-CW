<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Customer - ABB Robotics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles_background.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="finisher-header.es5.min.js"></script>
    <script src="functions.js" defer></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Fetch customer data and populate both table and dropdown
            fetch('get_customer_data.php')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.querySelector("table tbody");
                    const select = $('#customer_id');

                    // Populate customer data in table
                    if (data.length === 0) {
                        tbody.innerHTML = "<tr><td colspan='6'>No customers found.</td></tr>";
                    } else {
                        data.forEach(customer => {
                            const row = document.createElement("tr");
                            row.innerHTML = `
                                <td>${customer.customer_name}</td>
                                <td>${customer.email ?? ''}</td>
                                <td>${customer.phone_no ?? ''}</td>
                                <td>${customer.company ?? ''}</td>
                                <td>${customer.address ?? ''}</td>
                                <td>${customer.type_of_work ?? ''}</td>
                            `;
                            tbody.appendChild(row);

                            // Populate dropdown with customer names
                            select.append(`<option value="${customer.customer_id}">${customer.customer_name}</option>`);
                        });
                    }
                })
                .catch(error => {
                    console.error('Error fetching customer data:', error);
                });

            // Handle delete customer
            $('#deleteButton').click(function() {
                let customerId = $('#customer_id').val();
            
                if (customerId) {
                    $.ajax({
                        url: 'deletecustomer.php',
                        type: 'POST',
                        data: { customer_id: customerId },
                        success: function(response) {
                            $('#message').text(response);
                        },
                        error: function(xhr, status, error) {
                            $('#message').text('Error: ' + error);
                        }
                    });
                } else {
                    $('#message').text('Please select a customer.');
                }
            });
            
        });
    </script>
</head>

<body>
    <div class="header finisher-header" style="width: 100%; height: 100%;">

        <!-- Sidebar Navigation -->
        <nav>
            <input type="checkbox" id="sidebar-active">
            <label for="sidebar-active" class="open-sidebar-button">
                <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#e3e3e3"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
            </label>

            <label for="sidebar-active" id="overlay"></label>

            <div class="links-container">
                <label for="sidebar-active" class="close-sidebar-button">
                    <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#e3e3e3"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
                </label>

                <!-- <h4 class="text-center">CRM Menu</h4> -->
                <a class="home-link" href="dashboard.html">Home</a>
                <a href="profile.html"><i class="fas fa-user"></i><span class="sidebar-text"> My Profile</span></a>
                <a href="customer.html"><i class="fas fa-customer"></i><span class="sidebar-text"> Customers</span></a>
                <a href="reports.html"><i class="fas fa-chart-line"></i><span class="sidebar-text"> Reports</span></a>
                <a href="meetings.html"><i class="fas fa-calendar-alt"></i><span class="sidebar-text"> Set Up Meetings</span></a>
                <a href="calls.html"><i class="fas fa-phone"></i><span class="sidebar-text"> Schedule Calls</span></a>
                <a href="interactions.html"><i class="fas fa-interactions"></i><span class="sidebar-text"> Interaction History</span></a>
                <a href="logout.html"><i class="fas fa-sign-out-alt"></i><span class="sidebar-text"> Logout</span></a>

                <!-- darkmode button -->
                <input type="checkbox" id="darkmode-toggle" class="darkmode-toggle">
                <label for="darkmode-toggle" class="darkmode-btn"></label>
            </div>
        </nav>

        <!-- Main Content Section -->
        <div class="content">
            <div class="container">
                <h2>Select Customer to Delete</h2>
                <select id="customer_id">
                    <option value="">Select a customer</option>
                </select>

                <div class="button-container">
                    <button id="deleteButton" class="general-btns">Delete Customer</button>
                    <a href="customer.html" class="general-btns logout">Back to Customer List</a>
                </div>
                
                <p id="message" class="mt-2"></p>
            </div>

            <!-- Customer Table -->
            <table class="table mt-4">
                <thead>
                    <tr>
                        <th>Customer Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Company</th>
                        <th>Address</th>
                        <th>Type of Work</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Table rows will be populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
