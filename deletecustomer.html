<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Customer - ABB Robotics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles_background.css">
    <script src="functions.js" defer></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Fetch customer data and populate both table and dropdown
            fetch('get_customer_data.php')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.querySelector("table tbody");
                    const select = $('#customer_id');

                    // Populate customer data in table
                    if (data.length === 0) {
                        tbody.innerHTML = "<tr><td colspan='6'>No customers found.</td></tr>";
                    } else {
                        data.forEach(customer => {
                            const row = document.createElement("tr");
                            row.innerHTML = `
                                <td>${customer.customer_name}</td>
                                <td>${customer.email ?? ''}</td>
                                <td>${customer.phone_no ?? ''}</td>
                                <td>${customer.company ?? ''}</td>
                                <td>${customer.address ?? ''}</td>
                                <td>${customer.type_of_work ?? ''}</td>
                            `;
                            tbody.appendChild(row);

                            // Populate dropdown with customer names
                            select.append(`<option value="${customer.customer_id}">${customer.customer_name}</option>`);
                        });
                    }
                })
                .catch(error => {
                    console.error('Error fetching customer data:', error);
                });

            // Handle delete customer
            $('#deleteButton').click(function() {
                let customerId = $('#customer_id').val();
            
                if (customerId) {
                    $.ajax({
                        url: 'deletecustomer.php',
                        type: 'POST',
                        data: { customer_id: customerId },
                        success: function(response) {
                            $('#message').text(response);
                        },
                        error: function(xhr, status, error) {
                            $('#message').text('Error: ' + error);
                        }
                    });
                } else {
                    $('#message').text('Please select a customer.');
                }
            });
            
        });
    </script>

    <style>
        /* Sidebar Styling */
        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #343a40;
            padding-top: 20px;
            transition: all 0.3s ease-in-out;
        }
        .sidebar a {
            padding: 15px;
            text-decoration: none;
            font-size: 18px;
            color: white;
            display: flex;
            align-items: center;
            transition: background 0.3s;
        }
        .sidebar a i {
            margin-right: 10px;
        }
        .sidebar a:hover {
            background-color: #495057;
        }
        .content {
            margin-left: 260px;
            padding: 20px;
            transition: margin-left 0.3s ease-in-out;
        }
        .navbar-brand {
            font-size: 2rem; /* Increased navbar brand size */
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
        <h4 class="text-center text-light">CRM Menu</h4>
        <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i><span class="sidebar-text"> Dashboard</span></a>
        <a href="profile.html"><i class="fas fa-user"></i><span class="sidebar-text"> My Profile</span></a>
        <a href="customer.html"><i class="fas fa-customer"></i><span class="sidebar-text"> Customers</span></a>
        <a href="reports.html"><i class="fas fa-chart-line"></i><span class="sidebar-text"> Reports</span></a>
        <a href="meetings.html"><i class="fas fa-calendar-alt"></i><span class="sidebar-text"> Set Up Meetings</span></a>
        <a href="calls.html"><i class="fas fa-phone"></i><span class="sidebar-text"> Schedule Calls</span></a>
        <a href="interactions.html"><i class="fas fa-interactions"></i><span class="sidebar-text"> Interaction History</span></a>
        <a href="logout.html"><i class="fas fa-sign-out-alt"></i><span class="sidebar-text"> Logout</span></a>
    </div>

    <!-- Sidebar Toggle Button -->
    <div class="toggle-btn" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </div>

    <!-- Main Content Section -->
    <div class="content">
        <div class="card">
            <h2>Select Customer to Delete</h2>
            <select id="customer_id">
                <option value="">Select a customer</option>
            </select>
            <button id="deleteButton" class="btn btn-danger mt-2">Delete Customer</button>
            <a href="customer.html" class="btn btn-primary mt-2">Back to Customer List</a>
            <p id="message" class="mt-2"></p>
        </div>

        <!-- Customer Table -->
        <table class="table mt-4">
            <thead>
                <tr>
                    <th>Customer Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Company</th>
                    <th>Address</th>
                    <th>Type of Work</th>
                </tr>
            </thead>
            <tbody>
                <!-- Table rows will be populated here -->
            </tbody>
        </table>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Sidebar Toggle Script -->
    <script>
        function toggleSidebar() {
            let sidebar = document.getElementById("sidebar");
            let content = document.querySelector(".content");
            let toggleBtn = document.querySelector(".toggle-btn");

            sidebar.classList.toggle("collapsed");
            content.classList.toggle("collapsed");
            toggleBtn.classList.toggle("collapsed");

            // Adjust toggle button position dynamically
            if (sidebar.classList.contains("collapsed")) {
                toggleBtn.style.left = "80px";
            } else {
                toggleBtn.style.left = "260px";
            }
        }
    </script>
</body>
</html>
