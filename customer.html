    <!-- JavaScript for fetching user data -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch("get_user_data.php")
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("user-info").innerHTML = "<p style='color: red;'>" + data.error + "</p>";
                } else {
                    document.getElementById("user-name").innerText = data.name;
                    document.getElementById("user-email").innerText = data.email;
                }
            })
            .catch(error => console.error("Error fetching user data:", error));
        });
    </script>

    <!-- Javascript for fetching customer information -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('get_customer_data.php')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.querySelector("table tbody");
                    if (data.length === 0) {
                        tbody.innerHTML = "<tr><td colspan='8'>No customers found.</td></tr>";
                    } else {
                        data.forEach(customer => {
                            const row = document.createElement("tr");
                            row.innerHTML = `
                                <td>${customer.customer_name}</td>
                                <td>${customer.email ?? ''}</td>
                                <td>${customer.phone_no ?? ''}</td>
                                <td>${customer.company ?? ''}</td>
                                <td>${customer.address ?? ''}</td>
                                <td>${customer.type_of_work ?? ''}</td>
                                <td>
                                    <select class="form-select form-select-sm status-dropdown" 
                                        data-id="${customer.customer_id}" 
                                        onchange="updateStatus(this)">
                                        <option value="New" ${customer.status === "New" ? "selected" : ""}>New</option>
                                        <option value="Contacted" ${customer.status === "Contacted" ? "selected" : ""}>Contacted</option>
                                        <option value="In Progress" ${customer.status === "In Progress" ? "selected" : ""}>In Progress</option>
                                        <option value="Closed" ${customer.status === "Closed" ? "selected" : ""}>Closed</option>
                                    </select>
                                </td>
                            `;
                            tbody.appendChild(row);
                        });
                    }
                })
                .catch(error => {
                    console.error('Error fetching customer data:', error);
                });
        });

        function updateStatus(selectElement) {
            const customer_id = selectElement.getAttribute('data-id');
            const newStatus = selectElement.value;

            console.log("Updating Customer ID:", customer_id);
            console.log("New Status:", newStatus);

            fetch('update_customer_status.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    id: customer_id,
                    status: newStatus
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log("Response from server:", data);
                if (data.message) {
                    alert(data.message);
                }
            })
            .catch(error => {
                console.error("Error updating status:", error);
                alert("An error occurred while updating the status.");
            });
        }
    </script>
</head>
