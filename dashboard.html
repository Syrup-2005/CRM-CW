<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ABB Robotics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch("get_user_data.php")
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("user-info").innerHTML = "<p style='color: red;'>" + data.error + "</p>";
                } else {
                    document.getElementById("user-name").innerText = data.name;
                    document.getElementById("user-email").innerText = data.email;
                }
            })
            .catch(error => console.error("Error fetching user data:", error));
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Button data (text + link)
            let buttons = [
                { text: "Schedule a Call", link: "calls.html" },
                { text: "Manage Clients", link: "managecustomers.html" },
                { text: "View Reports", link: "reports.html" }, 
                { text: "Send an Email", link: "emails.html" },
                { text: "Customise Profile", link: "profile.html" }
            ];

            // Shuffle function (Fisher-Yates Algorithm)
            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]]; // Swap elements
                }
            }

            // Shuffle buttons
            shuffle(buttons);

            // Generate buttons dynamically
            let buttonContainer = document.getElementById("button-container");
            buttonContainer.innerHTML = ""; // Clear existing buttons

            buttons.forEach(button => {
                let a = document.createElement("a");
                a.href = button.link;
                a.className = "btn btn-primary w-50";
                a.innerText = button.text;
                buttonContainer.appendChild(a);
                buttonContainer.appendChild(document.createElement("br")); // Line break
            });
        });
    </script>

    <style>
        /* Sidebar Styling */
        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #343a40;
            padding-top: 20px;
            transition: all 0.3s ease-in-out;
        }
        .sidebar a {
            padding: 15px;
            text-decoration: none;
            font-size: 18px;
            color: white;
            display: flex;
            align-items: center;
            transition: background 0.3s;
        }
        .sidebar a i {
            margin-right: 10px;
        }
        .sidebar a:hover {
            background-color: #495057;
        }
        .content {
            margin-left: 260px;
            padding: 20px;
            transition: margin-left 0.3s ease-in-out;
        }
        .navbar-brand {
            font-size: 2rem; /* Increased navbar brand size */
            font-weight: bold;
        }
        /* Collapsible Sidebar */
        .toggle-btn {
            position: absolute;
            top: 15px;
            left: 260px;
            cursor: pointer;
            font-size: 20px;
            transition: left 0.3s ease-in-out;
            color: white;
            background-color: #343a40;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .collapsed {
            width: 70px;
        }
        .collapsed .sidebar-text {
            display: none;
        }
        .collapsed + .content {
            margin-left: 80px;
        }
        .collapsed .toggle-btn {
            left: 80px;
        }
    </style>
</head>

<body>
    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
        <h4 class="text-center text-light">CRM Menu</h4>
        <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i><span class="sidebar-text"> Dashboard</span></a>
        <a href="profile.html"><i class="fas fa-user"></i><span class="sidebar-text"> My Profile</span></a>
        <a href="reports.html"><i class="fas fa-chart-line"></i><span class="sidebar-text"> Reports</span></a>
        <a href="meetings.html"><i class="fas fa-calendar-alt"></i><span class="sidebar-text"> Set Up Meetings</span></a>
        <a href="calls.html"><i class="fas fa-phone"></i><span class="sidebar-text"> Schedule Calls</span></a>
        <a href="emails.html"><i class="fas fa-envelope"></i><span class="sidebar-text"> Send Emails</span></a>
        <a href="progresstracker.html"><i class="fas fa-chart-line"></i><span class="sidebar-text"> Progress Tracker</span></a>
        <a href="managecustomers.html"><i class="fas fa-chart-line"></i><span class="sidebar-text">Manage Customers</span></a>
        <a href="bugreport.html"><i class="fas fa-bug"></i><span class="sidebar-text"> Bug Report</span></a>
        <a href="teammembers.html"><i class="fas fa-users"></i><span class="sidebar-text"> Meet The Team</span></a>
        <a href="logout.html"><i class="fas fa-sign-out-alt"></i><span class="sidebar-text"> Logout</span></a>
    </div>

    <!-- Sidebar Toggle Button -->
    <div class="toggle-btn" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </div>

    <!-- Main Content Section -->
    <div class="content">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand" href="dashboard.html">ABB Robotics CRM</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#">To be added</a> <!-- Logout button in navbar -->
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="container mt-4">
            <h3>Welcome, <span id="user-name">Loading...</span>!</h3>
            <p>Your email: <span id="user-email">Loading...</span><br>What would you like to do?</p>

            <!-- Buttons Container -->
            <div id="button-container"></div>

            <a href="logout.php" class="btn btn-danger">Logout</a>
        </div>    
        

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Sidebar Toggle Script -->
    <script>
        function toggleSidebar() {
            let sidebar = document.getElementById("sidebar");
            let content = document.querySelector(".content");
            let toggleBtn = document.querySelector(".toggle-btn");

            sidebar.classList.toggle("collapsed");
            content.classList.toggle("collapsed");
            toggleBtn.classList.toggle("collapsed");

            // Adjust toggle button position dynamically
            if (sidebar.classList.contains("collapsed")) {
                toggleBtn.style.left = "80px";
            } else {
                toggleBtn.style.left = "260px";
            }
        }
    </script>
    
</body>
</html>
