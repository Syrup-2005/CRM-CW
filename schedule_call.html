<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Calls - ABB Robotics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles_background.css">
    <script src="functions.js" defer></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch('get_customer.php')
                .then(response => response.json())
                .then(data => {
                    const customerSelect = document.getElementById('customer_id');
        
                    data.forEach(customer => {
                        const option = document.createElement('option');
                        option.value = customer.customer_id;
                        option.textContent = customer.customer_name;
                        customerSelect.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Error loading customers:', error);
                });
        });
    </script>
</head>

<body>
    <!-- wave designs on top of page -->
    <div class="top-waves">
        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
        <div class="wave wave3"></div>
        <div class="wave wave4"></div>
        <div class="corner"></div>
    </div>

    <!-- darkmode button -->
    <input type="checkbox" id="darkmode-toggle" class="darkmode-toggle">
    <label for="darkmode-toggle" class="darkmode-btn"></label>
    
    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
        <h4 class="text-center">CRM Menu</h4>
        <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i><span class="sidebar-text"> Dashboard</span></a>
        <a href="profile.html"><i class="fas fa-user"></i><span class="sidebar-text"> My Profile</span></a>
        <a href="customer.html"><i class="fas fa-customer"></i><span class="sidebar-text"> Customers</span></a>
        <a href="reports.html"><i class="fas fa-chart-line"></i><span class="sidebar-text"> Reports</span></a>
        <a href="meetings.html"><i class="fas fa-calendar-alt"></i><span class="sidebar-text"> Set Up Meetings</span></a>
        <a href="calls.html"><i class="fas fa-phone"></i><span class="sidebar-text"> Schedule Calls</span></a>
        <a href="interactions.html"><i class="fas fa-interactions"></i><span class="sidebar-text"> Interaction History</span></a>
        <a href="logout.html"><i class="fas fa-sign-out-alt"></i><span class="sidebar-text"> Logout</span></a>
    </div>

    <!-- Sidebar Toggle Button -->
    <div class="toggle-btn" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </div>

    <!-- Main Content Section -->
    <div class="content">
    <div class="container mt-5">
        <h2>Schedule a New Call</h2>
        <form method="POST" action="schedule_call.php" class="mt-4">
            <!-- Dynamically populate customer dropdown -->
            <select class="form-select" id="customer_id" name="customer_id" required>
                <option value="">-- Select Customer --</option>
            </select>

            <div class="mb-3">
                <label for="datetime" class="form-label">Call Date & Time</label>
                <input type="datetime-local" class="form-control" id="datetime" name="datetime" required>
            </div>

            <div class="mb-3">
                <label for="call_type" class="form-label">Call Type</label>
                <select class="form-select" id="call_type" name="call_type" required>
                    <option value="">-- Select --</option>
                    <option value="initial">Initial Contact</option>
                    <option value="follow-up">Follow-Up</option>
                    <option value="support">Support</option>
                    <option value="sales">Sales Call</option>
                    <option value="progress">Progress Report</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="notes" class="form-label">Notes / Agenda</label>
                <textarea class="form-control" id="notes" name="notes" rows="4"></textarea>
            </div>

            <div class="button-container">
                <button type="submit" class="general-btns">Schedule Call</button>
            </div>
            
        </form>
    </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Sidebar Toggle Script -->
    <script>
        function toggleSidebar() {
            let sidebar = document.getElementById("sidebar");
            let content = document.querySelector(".content");
            let toggleBtn = document.querySelector(".toggle-btn");

            sidebar.classList.toggle("collapsed");
            content.classList.toggle("collapsed");
            toggleBtn.classList.toggle("collapsed");

            // Adjust toggle button position dynamically
            if (sidebar.classList.contains("collapsed")) {
                toggleBtn.style.left = "80px";
            } else {
                toggleBtn.style.left = "260px";
            }
        }
    </script>

</body>

</html>
