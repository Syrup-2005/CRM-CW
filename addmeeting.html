<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Calls - ABB Robotics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles_background.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="finisher-header.es5.min.js"></script>
    <script src="functions.js" defer></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch('get_customer.php')
                .then(response => response.json())
                .then(data => {
                    const customerSelect = document.getElementById('customer_id');
        
                    data.forEach(customer => {
                        const option = document.createElement('option');
                        option.value = customer.customer_id;
                        option.textContent = customer.customer_name;
                        customerSelect.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Error loading customers:', error);
                });
        });
    </script>

    <!-- Javascript to fetch admin data -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Fetch admins when the page loads
            fetch('get_admins.php')
                .then(response => response.json())
                .then(data => {
                    const adminSelect = document.getElementById("admin_id");
                    if (data.error) {
                        adminSelect.innerHTML = `<option>${data.error}</option>`;
                    } else {
                        let options = "";
                        data.forEach(admin => {
                            options += `<option value="${admin.user_id}">${admin.Name}</option>`;
                        });
                        adminSelect.innerHTML = options; // Populate select dropdown
                    }
                })
                .catch(error => console.error("Error fetching admin data:", error));
        });
    </script>
</head>

        <!-- Main Content Section -->
        <div class="content">
        <div class="container mt-5">
            <h2>Book a New Meeting</h2>
            <form method="POST" action="addmeeting.php" class="mt-4">
                <!-- Dynamically populate customer dropdown -->
                <select class="form-select" id="customer_id" name="customer_id" required>
                    <option value="">-- Select Customer --</option>
                </select>

                <div class="mb-3">
                    <label for="meeting_date" class="form-label">Meeting Date</label>
                    <input type="datetime-local" class="form-control" id="meeting_date" name="meeting_date" required>
                </div>

                <div class="mb-3">
                    <label for="meeting_purpose" class="form-label">Purpose of Meeting</label>
                    <select class="form-select" id="meeting_purpose" name="meeting_purpose" required>
                        <option value="">-- Select --</option>
                        <option value="initial">Initial Contact</option>
                        <option value="follow-up">Follow-Up</option>
                        <option value="support">Support</option>
                        <option value="sales">Sales Update</option>
                        <option value="progress">Progress Report</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="notes" class="form-label">Notes / Agenda</label>
                    <textarea class="form-control" id="notes" name="notes" rows="4"></textarea>
                </div>

                <!-- Admin Selection -->
                <div class="form-group mb-3">
                    <label for="admin_id">Assigned Admin</label>
                    <select name="admin_id" id="admin_id" class="form-control">
                        <option>Loading...</option> <!-- Placeholder text while fetching data -->
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="general-btns">Submit</button>
                </div>
            </form>
