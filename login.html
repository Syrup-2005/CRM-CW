<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABB Robotics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles_background.css">
    <link rel="stylesheet" href="styles.css">
    <!-- Load the FinisherHeader library before the custom script -->
    <script src="finisher-header.es5.min.js"></script>
    <script src="functions.js" defer></script>
</head>

<body>
    <div class="header finisher-header" style="width: 100vw; height: 100vh;">

        <!-- Sidebar Navigation -->
        <nav>
            <input type="checkbox" id="sidebar-active">
            <label for="sidebar-active" class="open-sidebar-button">
                <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#e3e3e3"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
            </label>

            <label for="sidebar-active" id="overlay"></label>

            <div class="links-container">
                <label for="sidebar-active" class="close-sidebar-button">
                    <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#e3e3e3"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
                </label>

                <!-- darkmode button -->
                <input type="checkbox" id="darkmode-toggle" class="darkmode-toggle">
                <label for="darkmode-toggle" class="darkmode-btn"></label>
            </div>
        </nav>
        

        <div class="content">
            <div class="login-signup-container" id="main">
                <div class="signup-container">
                    <form action="signup_process.php" method="POST">
                        <h1>Create an account</h1>
                        <input type="name" id="name" name="name" placeholder="Full Name" required>
                        <input type="email" id="email" name="email" placeholder="Email" required>
                        <input type="tel" id="phone" name="phone" placeholder="Phone" required>
                        <input type="password" id="signup-password" name="password" placeholder="Password" required>
                        <input type="password" id="signup-confirm_password" name="confirm_password" placeholder="Confirm Password" required>
                        <small id="passwordMismatch" class="form-text text-danger d-none">Passwords do not match.</small>

                        <div class="checkbox-container">
                            <input type="checkbox" id="show-signup-password-chkbx" onclick="toggleSignUpPasswordVisibility()">
                            <label for="show-signup-password-chkbx">Show Password</label>
                        </div>
                        
                        <div class="button-container">
                            <button class="general-btns">Sign up</button>
                        </div>
                    </form>
                </div>

                <div class="login-container">
                    <form action="login.php" method="POST">
                        <h1>Login to your account</h1>
                        <input type="email" name="email" placeholder="Email" required>
                        <input type="password" id="login-password" name="password" placeholder="Password" required>

                        <div class="checkbox-container">
                            <input type="checkbox" id="show-login-password-chkbx" onclick="toggleLogInPasswordVisibility()">
                            <label for="show-login-password-chkbx">Show Password</label>
                        </div>
                        
                        <div class="button-container">
                            <button class="general-btns">Login</button>
                        </div>
                    </form>
                </div>

                <div class="overlay-container">
                    <div class="overlay">
                        <div class="overlay-left">
                            <h1>Already have an account?</h1>
                            <div class="button-container">
                                <button class="general-btns logIN" id="logIN">Login</button>
                            </div>
                        </div>
                        <div class="overlay-right">
                            <h1>Welcome to</h1>
                            <h2 class="gradient-abb">ABB Robotics</h2>
                            <p>Don't have an account?</p>
                            <div class="button-container">
                                <button class="general-btns signUP" id="signUP">Sign Up</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        // JavaScript to handle the overlay and form switching
        const signUpButton = document.getElementById('signUP');
        const logInButton = document.getElementById('logIN');
        const main = document.getElementById('main');

        signUpButton.addEventListener('click', () => {
            main.classList.add('right-panel-active');
        });

        logInButton.addEventListener('click', () => {
            main.classList.remove('right-panel-active');
        });
    </script>

    <!-- Javascript for Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Password Validation JavaScript -->
    <script>
        function validatePassword() {
            let password = document.getElementById("signup-password").value;
            let confirmPassword = document.getElementById("signup-confirm_password").value;
            let message = document.getElementById("passwordMismatch");

            if (password !== confirmPassword) {
                message.classList.remove("d-none");
            } else {
                message.classList.add("d-none");
            }
        }
    </script>

    <script>
        function toggleSignUpPasswordVisibility() {
            let PasswordField = document.getElementById("signup-password");
            PasswordField.type = PasswordField.type === "password" ? "text" : "password";

            let ConfirmPasswordField = document.getElementById("signup-confirm_password");
            ConfirmPasswordField.type = ConfirmPasswordField.type === "password" ? "text" : "password";
        }
    </script>

    <script>
        function toggleLogInPasswordVisibility() {
            let passwordField = document.getElementById("login-password");
            passwordField.type = passwordField.type === "password" ? "text" : "password";
        }
    </script>
</body>

</html>
