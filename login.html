    <div class="content">
    <div class="container">
        <h3 class="text-center mb-3">CRM Login</h3>

        <form action="login.php" method="POST">
            <!-- Email input -->
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div> 

            <!-- Password input -->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
                
                <!-- Password toggle -->
                <div class="form-check mt-2">
                    <input class="form-check-input" type="checkbox" id="showPassword" onclick="togglePasswordVisibility()">
                    <label class="form-check-label" for="showPassword">Show Password</label>
                </div>
            </div>
            
            <!-- Submit button -->
            <div class="button-container">
                <button type="submit" class="general-btns">Login</button>
            </div>
            <!-- Links for Signup and Forgot Password -->
            <div class="mt-3 text-center">
                <a href="signup.html" class="btn btn-link">Sign Up</a>
            </div>
        </form>
    </div>
    </div>

    <!-- Javascript for Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function togglePasswordVisibility() {
            let passwordField = document.getElementById("password");
            passwordField.type = passwordField.type === "password" ? "text" : "password";
        }
    </script>
