<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABB Robotics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="background.css">
    <script src="functions.js" defer></script>
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-shadow">
    <!-- wave designs on top of page -->
    <div class="top-waves">
        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
        <div class="wave wave3"></div>
        <div class="wave wave4"></div>
        <div class="corner"></div>
    </div>

    <!-- darkmode button -->
    <input type="checkbox" id="darkmode-toggle" class="darkmode-toggle">
    <label for="darkmode-toggle" class="darkmode-btn"></label>

    <div class="card p-4 shadow-lg" style="width: 350px;">
        <h3 class="text-center mb-3">CRM Login</h3>

        <form action="login.php" method="POST">
            <!-- Email input -->
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div> 

            <!-- Password input -->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
                
                <!-- Password toggle -->
                <div class="form-check mt-2">
                    <input class="form-check-input" type="checkbox" id="showPassword" onclick="togglePasswordVisibility()">
                    <label class="form-check-label" for="showPassword">Show Password</label>
                </div>
            </div>
            
            <!-- Submit button -->
            <button type="submit" class="btn btn-primary w-100">Login</button>

            <!-- Links for Signup and Forgot Password -->
            <div class="mt-3 text-center">
                <a href="signup.html" class="btn btn-link">Sign Up</a>
                <a href="forgot_password.html" class="btn btn-link">Forgot Password</a>
            </div>
        </form>
    </div>

    <!-- Javascript for Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function togglePasswordVisibility() {
            let passwordField = document.getElementById("password");
            passwordField.type = passwordField.type === "password" ? "text" : "password";
        }
    </script>

</body>

</html>
