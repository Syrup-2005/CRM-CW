<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Customer - ABB Robotics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles_background.css">
    <link rel="stylesheet" href="styles.css">
    <script src="functions.js" defer></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch("get_meeting_data.php")
            .then(res => res.json())
            .then(data => {
                const tbody = document.querySelector("table tbody");
                const dropdown = document.getElementById("customer_id");

                if (data.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='4'>No upcoming meetings.</td></tr>";
                } else {
                    data.forEach(meeting => {
                        // Populate the table
                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${meeting.customer_id}</td>
                            <td>${meeting.meeting_date}</td>
                            <td>${meeting.meeting_type}</td>
                            <td>${meeting.notes ?? ''}</td>
                        `;
                        tbody.appendChild(row);

                        // Populate the dropdown (ensure uniqueness of customer IDs)
                        if (!Array.from(dropdown.options).some(option => option.value === meeting.customer_id)) {
                            const option = document.createElement("option");
                            option.value = meeting.customer_id;
                            option.text = `Customer ${meeting.customer_id}`;
                            dropdown.appendChild(option);
                        }
                    });
                }
            })


            // Handle delete customer
            $('#deleteButton').click(function() {
                let customerId = $('#customer_id').val();
            
                if (customerId) {
                    $.ajax({
                        url: 'deletemeeting.php',
                        type: 'POST',
                        data: { customer_id: customerId },
                        success: function(response) {
                            $('#message').text(response);
                        },
                        error: function(xhr, status, error) {
                            $('#message').text('Error: ' + error);
                        }
                    });
                } else {
                    $('#message').text('Please select a meeting.');
                }
            });
            
        });
    </script>
</head>

<body>
    <!-- wave designs on top of page -->
    <div class="top-waves">
        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
        <div class="wave wave3"></div>
        <div class="wave wave4"></div>
        <div class="corner"></div>
    </div>

    <!-- Sidebar Navigation -->
    <nav>
        <input type="checkbox" id="sidebar-active">
        <label for="sidebar-active" class="open-sidebar-button">
            <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#e3e3e3"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
        </label>

        <label for="sidebar-active" id="overlay"></label>

        <div class="links-container">
            <label for="sidebar-active" class="close-sidebar-button">
                <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#e3e3e3"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
            </label>

            <!-- <h4 class="text-center">CRM Menu</h4> -->
            <a class="home-link" href="dashboard.html">Home</a>
            <a href="profile.html"><i class="fas fa-user"></i><span class="sidebar-text"> My Profile</span></a>
            <a href="customer.html"><i class="fas fa-customer"></i><span class="sidebar-text"> Customers</span></a>
            <a href="reports.html"><i class="fas fa-chart-line"></i><span class="sidebar-text"> Reports</span></a>
            <a href="meetings.html"><i class="fas fa-calendar-alt"></i><span class="sidebar-text"> Set Up Meetings</span></a>
            <a href="calls.html"><i class="fas fa-phone"></i><span class="sidebar-text"> Schedule Calls</span></a>
            <a href="interactions.html"><i class="fas fa-interactions"></i><span class="sidebar-text"> Interaction History</span></a>
            <a href="logout.html"><i class="fas fa-sign-out-alt"></i><span class="sidebar-text"> Logout</span></a>

            <!-- darkmode button -->
            <input type="checkbox" id="darkmode-toggle" class="darkmode-toggle">
            <label for="darkmode-toggle" class="darkmode-btn"></label>
        </div>
    </nav>

    <!-- Main Content Section -->
    <div class="content">
        <div class="container">
            <h2>Select Meeting to Delete</h2>
            <select id="customer_id">
                <option value="">Select a Meeting</option>
            </select>
            
            <div class="button-container">
                <button id="deleteButton" class="general-btns">Delete Meeting</button>
                <a href="meetings.html" class="general-btns logout">Back to Meeting List</a>
            </div>

            <p id="message" class="mt-2"></p>
        </div>

        <table class="table mt-4">
            <thead>
                <tr>
                    <th>Customer ID</th>
                    <th>Meeting Date</th>
                    <th>Meeting Type</th>
                    <th>Notes / Agenda</th>
                </tr>
            </thead>
            <tbody>
                <!-- Table rows will be populated here -->
            </tbody>
        </table>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
