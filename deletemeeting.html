<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Customer - ABB Robotics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles_background.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="finisher-header.es5.min.js"></script>
    <script src="functions.js" defer></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Initialize Select2 on the meeting_id dropdown
            $('#meeting_id').select2({
                placeholder: 'Select a Meeting',
                allowClear: true
            });
    
            // Fetch all meetings initially and display them
            fetch("get_meeting_data.php")
            .then(res => res.json())
            .then(data => {
                const tbody = document.querySelector("table tbody");
                const dropdown = document.getElementById("meeting_id");
    
                if (data.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='6'>No upcoming meetings.</td></tr>";
                } else {
                    // Populate the dropdown with Select2 options
                    data.forEach(meeting => {
                        const option = document.createElement("option");
                        option.value = meeting.meeting_id;
                        option.text = `Meeting ID ${meeting.meeting_id} - ${meeting.customer_name}`;
                        dropdown.appendChild(option);
                    });
    
                    // Show all meetings in the table
                    showAllMeetings(data);
    
                    // Refresh the Select2 dropdown after populating the options
                    $('#meeting_id').trigger('change');
                }
            });
    
            // Handle when a user selects a meeting from the dropdown
            $('#meeting_id').on('change', function() {
                const meetingId = $(this).val();
                if (meetingId) {
                    // Show the selected meeting's data in the table
                    showSelectedMeeting(meetingId);
                } else {
                    // Show all meetings in the table again if no meeting is selected
                    fetch("get_meeting_data.php")
                    .then(res => res.json())
                    .then(data => {
                        showAllMeetings(data);
                    });
                }
            });
    
            // Function to display all meetings in the table
            function showAllMeetings(meetings) {
                const tbody = document.querySelector("table tbody");
                tbody.innerHTML = "";  // Clear any existing rows
    
                if (meetings.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='6'>No meetings available.</td></tr>";
                } else {
                    meetings.forEach(meeting => {
                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${meeting.meeting_id}</td>
                            <td>${meeting.customer_id}</td>
                            <td>${meeting.customer_name ?? ''}</td>
                            <td>${meeting.meeting_date}</td>
                            <td>${meeting.meeting_purpose}</td>
                            <td>${meeting.notes ?? ''}</td>
                        `;
                        tbody.appendChild(row);
                    });
                }
            }
    
            // Function to display only the selected meeting in the table
            function showSelectedMeeting(meetingId) {
                const tbody = document.querySelector("table tbody");
    
                // Clear any existing rows in the table
                tbody.innerHTML = "";
    
                // Fetch the specific meeting data
                fetch("get_meeting_data.php")
                .then(res => res.json())
                .then(data => {
                    const meeting = data.find(m => m.meeting_id == meetingId); // Find the selected meeting
                    if (meeting) {
                        // Populate the table with the selected meeting's data
                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${meeting.meeting_id}</td>
                            <td>${meeting.customer_id}</td>
                            <td>${meeting.customer_name ?? ''}</td>
                            <td>${meeting.meeting_date}</td>
                            <td>${meeting.meeting_purpose}</td>
                            <td>${meeting.notes ?? ''}</td>
                        `;
                        tbody.appendChild(row);
                    } else {
                        tbody.innerHTML = "<tr><td colspan='6'>No data found for the selected meeting.</td></tr>";
                    }
                });
            }
    
            // Handle delete meeting
            $('#deleteButton').click(function() {
                let meetingId = $('#meeting_id').val();
    
                if (meetingId) {
                    $.ajax({
                        url: 'deletemeeting.php',
                        type: 'POST',
                        data: { meeting_id: meetingId },
                        success: function(response) {
                            $('#message').text(response); // Show delete success message
                            // Reload the meeting table data after deletion to show all remaining meetings
                            fetch("get_meeting_data.php")
                            .then(res => res.json())
                            .then(data => {
                                showAllMeetings(data);
                            });
                            // Optionally, remove the deleted meeting from the dropdown
                            $(`#meeting_id option[value="${meetingId}"]`).remove();
                            $('#meeting_id').trigger('change'); // Refresh Select2
                        },
                        error: function(xhr, status, error) {
                            $('#message').text('Error: ' + error);
                        }
                    });
                } else {
                    $('#message').text('Please select a meeting.');
                }
            });
        });
    </script>     
</head>

<body>

        <nav>
            <input type="checkbox" id="sidebar-active">

                    <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#e3e3e3"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
                </label>

                <!-- <h4 class="text-center">CRM Menu</h4> -->
                <a class="home-link" href="dashboard.html">Home</a>
                <a href="profile.html"><i class="fas fa-user"></i><span class="sidebar-text"> My Profile</span></a>
                <a href="customer.html"><i class="fas fa-customer"></i><span class="sidebar-text"> Customers</span></a>
                <a href="meetings.html"><i class="fas fa-calendar-alt"></i><span class="sidebar-text"> Meetings</span></a>
                <a href="calls.html"><i class="fas fa-phone"></i><span class="sidebar-text"> Calls</span></a>
                <a href="interaction_history.php"><i class="fas fa-interactions"></i><span class="sidebar-text"> Interaction History</span></a>

                <input type="checkbox" id="darkmode-toggle" class="darkmode-toggle">
                <label for="darkmode-toggle" class="darkmode-btn"></label>
            </div>
        </nav>

        <!-- Main Content Section -->
        <div class="content">
            <div class="container">
                <h2>Select Meeting to Delete</h2>
                <select id="meeting_id" style="width: 70%">
                    <option value="">Select a Meeting</option>
                </select>
                
                <div class="button-container">
                    <button id="deleteButton" class="general-btns logout">Delete Meeting</button>
                    <a href="meetings.html" class="general-btns">Back to Meeting List</a>
                </div>

                <p id="message" class="mt-2"></p>
            </div>

            <table class="table mt-4">
                <thead>
                    <tr>
                        <th>Meeting ID</th>
                        <th>Customer ID</th>
                        <th>Customer Name</th>
                        <th>Meeting Date</th>
                        <th>Purpose of Meeting</th>
                        <th>Notes / Agenda</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Table rows will be populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
