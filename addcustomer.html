    <!-- Javascript to fetch admin data -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let admins = [];
        
            // Fetch admins
            fetch('get_admins.php')
            .then(response => response.json())
            .then(data => {
                if (!data.error) {
                    admins = data;
                }
            })
            .catch(error => console.error("Error fetching admin data:", error));
        
            const adminSearch = document.getElementById("admin_search");
            const adminDropdown = document.getElementById("admin_dropdown");
            const hiddenAdminId = document.getElementById("admin_id");
        
            function showDropdown(filteredAdmins) {
                adminDropdown.innerHTML = "";
        
                if (filteredAdmins.length === 0) {
                    adminDropdown.innerHTML = `<div class="list-group-item">No results found</div>`;
                } else {
                    filteredAdmins.forEach(admin => {
                        const option = document.createElement("button");
                        option.type = "button";
                        option.className = "list-group-item list-group-item-action";
                        option.textContent = admin.Name;
                        option.addEventListener("click", function() {
                            adminSearch.value = admin.Name;
                            hiddenAdminId.value = admin.user_id;
                            adminDropdown.style.display = "none";
                        });
                        adminDropdown.appendChild(option);
                    });
                }
        
                adminDropdown.style.display = "block";
            }
        
            function filterAdmins(searchTerm) {
                if (searchTerm.trim() === "") {
                    showDropdown(admins); // Show all admins when empty
                } else {
                    const filteredAdmins = admins.filter(admin =>
                        admin.Name.toLowerCase().includes(searchTerm)
                    );
                    showDropdown(filteredAdmins);
                }
            }
        
            // When typing
            adminSearch.addEventListener("input", function() {
                const searchTerm = this.value.toLowerCase();
                filterAdmins(searchTerm);
            });
        
            // When focusing/clicking
            adminSearch.addEventListener("focus", function() {
                filterAdmins(this.value.toLowerCase());
            });
        
            // Hide dropdown when clicking outside
            document.addEventListener("click", function(event) {
                if (!adminSearch.contains(event.target) && !adminDropdown.contains(event.target)) {
                    adminDropdown.style.display = "none";
                }
            });
        });   
    </script>
    
    <!-- JavaScript for fetching user data -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch("get_user_data.php")
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("user-info").innerHTML = "<p style='color: red;'>" + data.error + "</p>";
                } else {
                    document.getElementById("user-name").innerText = data.name;
                    document.getElementById("user-email").innerText = data.email;
                }
            })
            .catch(error => console.error("Error fetching user data:", error));
        });
    </script>
    
    <!-- Javascript for fetching customer information -->
    <script>
        fetch('get_customer_data.php')
        .then(res => res.json())
        .then(data => {
            const tbody = document.querySelector("table tbody");
            if (data.length === 0) {
                tbody.innerHTML = "<tr><td colspan='4'>No customers found.</td></tr>";
            } else {
                data.forEach(customer => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                    <td>${customer.customer_name}</td>
                    <td>${customer.email ?? ''}</td>
                    <td>${customer.phone_no ?? ''}</td>
                    <td>${customer.company ?? ''}</td>
                    <td>${customer.address ?? ''}</td>
                    `;
                    tbody.appendChild(row);
                });
                }
            })
            .catch(error => {
                console.error('Error fetching customer data:', error);
            });
    </script>
