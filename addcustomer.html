<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer - ABB Robotics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles_background.css">
    <script src="functions.js" defer></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <!-- Javascript to fetch admin data -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Fetch admins when the page loads
            fetch('get_admins.php')
                .then(response => response.json())
                .then(data => {
                    const adminSelect = document.getElementById("admin_id");
                    if (data.error) {
                        adminSelect.innerHTML = `<option>${data.error}</option>`;
                    } else {
                        let options = "";
                        data.forEach(admin => {
                            options += `<option value="${admin.user_id}">${admin.Name}</option>`;
                        });
                        adminSelect.innerHTML = options; // Populate select dropdown
                    }
                })
                .catch(error => console.error("Error fetching admin data:", error));
        });
    </script>

    <!-- JavaScript for fetching user data -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch("get_user_data.php")
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("user-info").innerHTML = "<p style='color: red;'>" + data.error + "</p>";
                } else {
                    document.getElementById("user-name").innerText = data.name;
                    document.getElementById("user-email").innerText = data.email;
                }
            })
            .catch(error => console.error("Error fetching user data:", error));
        });
    </script>

    <!-- Javascript for fetching customer information -->
    <script>
        fetch('get_customer_data.php')
            .then(res => res.json())
            .then(data => {
                const tbody = document.querySelector("table tbody");
                if (data.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='4'>No customers found.</td></tr>";
                } else {
                    data.forEach(customer => {
                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${customer.customer_name}</td>
                            <td>${customer.email ?? ''}</td>
                            <td>${customer.phone_no ?? ''}</td>
                            <td>${customer.company ?? ''}</td>
                            <td>${customer.address ?? ''}</td>
                        `;
                        tbody.appendChild(row);
                    });
                }
            })
            .catch(error => {
                console.error('Error fetching customer data:', error);
            });
    </script>
</head>

<body>
    <!-- wave designs on top of page -->
    <div class="top-waves">
        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
        <div class="wave wave3"></div>
        <div class="wave wave4"></div>
        <div class="corner"></div>
    </div>

    <!-- darkmode button -->
    <input type="checkbox" id="darkmode-toggle" class="darkmode-toggle">
    <label for="darkmode-toggle" class="darkmode-btn"></label>

    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
        <h4 class="text-center">CRM Menu</h4>
        <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i><span class="sidebar-text"> Dashboard</span></a>
        <a href="profile.html"><i class="fas fa-user"></i><span class="sidebar-text"> My Profile</span></a>
        <a href="customer.html"><i class="fas fa-customer"></i><span class="sidebar-text"> Customers</span></a>
        <a href="reports.html"><i class="fas fa-chart-line"></i><span class="sidebar-text"> Reports</span></a>
        <a href="meetings.html"><i class="fas fa-calendar-alt"></i><span class="sidebar-text"> Set Up Meetings</span></a>
        <a href="calls.html"><i class="fas fa-phone"></i><span class="sidebar-text"> Schedule Calls</span></a>
        <a href="interactions.html"><i class="fas fa-interactions"></i><span class="sidebar-text"> Interaction History</span></a>
        <a href="logout.html"><i class="fas fa-sign-out-alt"></i><span class="sidebar-text"> Logout</span></a>
    </div>

    <!-- Sidebar Toggle Button -->
    <div class="toggle-btn" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </div>

    <!-- Main Content Section -->
    <div class="content">
    <div class="container mt-5">
        <h2>Add New Customer</h2>

        <form action="addcustomer.php" method="POST">
           <!-- Name -->
           <div class="form-group mb-3">
                <label for="name">Full Name:</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>

            <!-- Email -->
            <div class="form-group mb-3">
                <label for="email">Email:</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <!-- Phone Number -->
            <div class="form-group mb-3">
                <label for="phone">Phone Number:</label>
                <input type="tel" class="form-control" id="phone" name="phone" required>
            </div>

            <!-- Customer Details -->
            <div class="mb-3">
                <label for="company" class="form-label">Company</label>
                <input type="text" name="company" id="company" class="form-control">
            </div>
            
            <div class="form-group mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea name="address" id="address" rows="4" class="form-control"></textarea>
            </div>

            <!-- Type of work requested -->
            <div class="mb-3">
                <label for="typeofwork" class="form-label">Type of Work Requested</label>
                <input type="text" name="typeofwork" id="type_of_work" class="form-control" required>
            </div>

            <!-- Admin Selection -->
            <div class="form-group mb-3">
                <label for="admin_id">Assigned Admin</label>
                <select name="admin_id" id="admin_id" class="form-control">
                    <option>Loading...</option> <!-- Placeholder text while fetching data -->
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="general-btns">Submit</button>
            </div>
        </form>
    </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Sidebar Toggle Script -->
    <script>
        function toggleSidebar() {
            let sidebar = document.getElementById("sidebar");
            let content = document.querySelector(".content");
            let toggleBtn = document.querySelector(".toggle-btn");

            sidebar.classList.toggle("collapsed");
            content.classList.toggle("collapsed");
            toggleBtn.classList.toggle("collapsed");

            // Adjust toggle button position dynamically
            if (sidebar.classList.contains("collapsed")) {
                toggleBtn.style.left = "80px";
            } else {
                toggleBtn.style.left = "260px";
            }
        }
    </script>

</body>

</html>
