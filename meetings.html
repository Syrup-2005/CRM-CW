    <!-- JavaScript for fetching user data -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch("get_user_data.php")
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("user-info").innerHTML = "<p style='color: red;'>" + data.error + "</p>";
                } else {
                    document.getElementById("user-name").innerText = data.name;
                    document.getElementById("user-email").innerText = data.email;
                }
            })
            .catch(error => console.error("Error fetching user data:", error));
        });
    </script>

    <!-- Javascript for fetching customer information -->
    <script>
        // Fetch meeting data
        fetch("get_meeting_data.php")
            .then(res => res.json())
            .then(data => {
                const tbody = document.querySelector("table tbody");
                if (data.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='4'>No upcoming meetings.</td></tr>";
                } else {
                    data.forEach(meeting => {
                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${meeting.customer_id}</td>
                            <td>${meeting.meeting_date}</td>
                            <td>${meeting.meeting_purpose}</td>
                            <td>${meeting.notes ?? ''}</td>
                        `;
                        tbody.appendChild(row);
                    });
                }
            })
            .catch(error => {
                console.error("Error fetching meeting data:", error);
            });
    </script>
</head>
