<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer - ABB Robotics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles_background.css">
    <script src="functions.js" defer></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <!-- JavaScript for fetching user data -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch("get_user_data.php")
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("user-info").innerHTML = "<p style='color: red;'>" + data.error + "</p>";
                } else {
                    document.getElementById("user-name").innerText = data.name;
                    document.getElementById("user-email").innerText = data.email;
                }
            })
            .catch(error => console.error("Error fetching user data:", error));
        });
    </script>

    <!-- Javascript for fetching customer information -->
    <script>
        // Fetch meeting data
        fetch("get_meeting_data.php")
            .then(res => res.json())
            .then(data => {
                const tbody = document.querySelector("table tbody");
                if (data.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='4'>No upcoming meetings.</td></tr>";
                } else {
                    data.forEach(meeting => {
                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${meeting.customer_id}</td>
                            <td>${meeting.meeting_date}</td>
                            <td>${meeting.meeting_type}</td>
                            <td>${meeting.notes ?? ''}</td>
                        `;
                        tbody.appendChild(row);
                    });
                }
            })
            .catch(error => {
                console.error("Error fetching meeting data:", error);
            });
    </script>
    

    <style>
        /* Sidebar Styling */
        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #343a40;
            padding-top: 20px;
            transition: all 0.3s ease-in-out;
        }
        .sidebar a {
            padding: 15px;
            text-decoration: none;
            font-size: 18px;
            color: white;
            display: flex;
            align-items: center;
            transition: background 0.3s;
        }
        .sidebar a i {
            margin-right: 10px;
        }
        .sidebar a:hover {
            background-color: #495057;
        }
        .content {
            margin-left: 260px;
            padding: 20px;
            transition: margin-left 0.3s ease-in-out;
        }
        .navbar-brand {
            font-size: 2rem; /* Increased navbar brand size */
            font-weight: bold;
        }
        /* Collapsible Sidebar */
        .toggle-btn {
            position: absolute;
            top: 15px;
            left: 260px;
            cursor: pointer;
            font-size: 20px;
            transition: left 0.3s ease-in-out;
            color: white;
            background-color: #343a40;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .collapsed {
            width: 70px;
        }
        .collapsed .sidebar-text {
            display: none;
        }
        .collapsed + .content {
            margin-left: 80px;
        }
        .collapsed .toggle-btn {
            left: 80px;
        }
    </style>
</head>

<body>
    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
        <h4 class="text-center text-light">CRM Menu</h4>
        <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i><span class="sidebar-text"> Dashboard</span></a>
        <a href="profile.html"><i class="fas fa-user"></i><span class="sidebar-text"> My Profile</span></a>
        <a href="customer.html"><i class="fas fa-customer"></i><span class="sidebar-text"> Customers</span></a>
        <a href="reports.html"><i class="fas fa-chart-line"></i><span class="sidebar-text"> Reports</span></a>
        <a href="meetings.html"><i class="fas fa-calendar-alt"></i><span class="sidebar-text"> Set Up Meetings</span></a>
        <a href="calls.html"><i class="fas fa-phone"></i><span class="sidebar-text"> Schedule Calls</span></a>
        <a href="interactions.html"><i class="fas fa-interactions"></i><span class="sidebar-text"> Interaction History</span></a>
        <a href="logout.html"><i class="fas fa-sign-out-alt"></i><span class="sidebar-text"> Logout</span></a>
    </div>

    <!-- Sidebar Toggle Button -->
    <div class="toggle-btn" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </div>

    <!-- Main Content Section -->
    <div class="card">
        <div class="table-responsive">
            <table class="table">
                <h1>Upcoming Meetings</h1>
                <thead>
                    <tr>
                        <th>Customer ID</th>
                        <th>Meeting Date</th>
                        <th>Meeting Type</th>
                        <th>Notes / Agenda</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <a href="addmeeting.html" class="btn btn-primary">Book a new meeting</a>
        <a href="deletemeeting.html" class="btn btn-danger">Delete a meeting</a>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Sidebar Toggle Script -->
    <script>
        function toggleSidebar() {
            let sidebar = document.getElementById("sidebar");
            let content = document.querySelector(".content");
            let toggleBtn = document.querySelector(".toggle-btn");

            sidebar.classList.toggle("collapsed");
            content.classList.toggle("collapsed");
            toggleBtn.classList.toggle("collapsed");

            // Adjust toggle button position dynamically
            if (sidebar.classList.contains("collapsed")) {
                toggleBtn.style.left = "80px";
            } else {
                toggleBtn.style.left = "260px";
            }
        }
    </script>

</body>

</html>
