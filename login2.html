<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABB Robotics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles_background.css">
    <link rel="stylesheet" href="styles.css">
    <!-- Load the FinisherHeader library before the custom script -->
    <script src="finisher-header.es5.min.js"></script>
    <script src="functions.js" defer></script>
</head>

<body>
    <div class="header finisher-header" style="width: 100%; height: 100%;">

        <!-- Sidebar Navigation -->
        <nav>
            <input type="checkbox" id="sidebar-active">
            <label for="sidebar-active" class="open-sidebar-button">
                <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#e3e3e3"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
            </label>

            <label for="sidebar-active" id="overlay"></label>

            <div class="links-container">
                <label for="sidebar-active" class="close-sidebar-button">
                    <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#e3e3e3"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
                </label>

                <!-- darkmode button -->
                <input type="checkbox" id="darkmode-toggle" class="darkmode-toggle">
                <label for="darkmode-toggle" class="darkmode-btn"></label>
            </div>
        </nav>
        

        <div class="content">
            <div class="login-signup-container">
                <input type="checkbox" id="chk" aria-hidden="true">

                <div class="signup-container">
                    <form action="signup_process.php" method="POST">
                        <label for="chk" aria-hidden="true" id="signup-title">Sign up</label>
                        <input type="name" id="name" name="name" placeholder="Full Name" required>
                        <input type="email" id="email" name="email" placeholder="Email" required>
                        <input type="tel" id="phone" name="phone" placeholder="Phone" required>
                        <input type="password" id="pswd" name="pswd" placeholder="Password" required>
                        <input type="password" id="cfm_pswd" name="cfm_pswd" placeholder="Confirm Password" required>
                        <small id="passwordMismatch" class="form-text text-danger d-none">Passwords do not match.</small>

                        <div class="button-container">
                            <button class="general-btns">Sign up</button>
                        </div>
                    </form>
                </div>

                <div class="login-container">
                    <form action="login.php" method="POST">
                        <label for="chk" aria-hidden="true" id="login-title">Login</label>
                        <input type="email" name="email" placeholder="Email" required>
                        <input type="password" id="password" name="pswd" placeholder="Password" required>

                        <div class="checkbox-container">
                            <input type="checkbox" id="show-password-chkbx" onclick="togglePasswordVisibility()">
                            <label for="show-password-chkbx">Show Password</label>
                        </div>
                        
                        <div class="button-container">
                            <button class="general-btns">Login</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Javascript for Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Password Validation JavaScript -->
    <script>
        function validatePassword() {
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;
            let message = document.getElementById("passwordMismatch");

            if (password !== confirmPassword) {
                message.classList.remove("d-none");
            } else {
                message.classList.add("d-none");
            }
        }
    </script>

    <script>
        function togglePasswordVisibility() {
            let passwordField = document.getElementById("password");
            passwordField.type = passwordField.type === "password" ? "text" : "password";
        }
    </script>
</body>

</html>
