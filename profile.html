        <!-- Main Content Section -->
        <div class="content">
            <h1 class="gradient-abb">ABB Robotics</h1>

        <div class="container mt-5">
            <h2>My Profile</h2>

            <!-- User Details -->
            <p><strong>Name:</strong> <span id="user-name">Loading...</span></p>
            <p><strong>Company:</strong> <span id="user-company">Loading...</span></p>
            <p><strong>Position:</strong> <span id="user-position">Loading...</span></p>
            <p><strong>Email:</strong> <span id="user-email">Loading...</span></p>
            <p><strong>Address:</strong> <span id="user-address">Loading...</span></p>
    
            <script>
                document.addEventListener("DOMContentLoaded", function() {
                    fetch("get_user_data.php") //Linked to get user data.php, need to update the db 
                    .then(response => response.json())
                    .then(data => {
                        if (data.error) {
                            document.getElementById("user-name").innerText = "Error loading data";
                        } else {
                            document.getElementById("user-name").innerText = data.name;
                            document.getElementById("user-company").innerText = data.company;
                            document.getElementById("user-position").innerText = data.position;
                            document.getElementById("user-email").innerText = data.email;
                            document.getElementById("user-address").innerText = data.address;
                            document.getElementById("profile-pic").src = data.profile_picture || "default.jpg";
                        }
                    })
                    .catch(error => console.error("Error fetching user data:", error));
                });
            </script>
            
            <!-- Update details form -->
            <form action="update_user_profile.php" method="POST">
                <button type="submit" class="general-btns">Edit</button>

            <!-- Back to Dashboard -->
            <div class="button-container">
                <a href="dashboard.html" class="general-btns logout">Cancel</a>
            </div>
